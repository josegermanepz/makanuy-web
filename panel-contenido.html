<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Publicar recetario | Makanuy</title><link rel="stylesheet" href="/enhanced.css"><link rel="stylesheet" href="/v5.css?v=20260804a"><link rel="stylesheet" href="/v6.css?v=20260806a"></head><body><main id="contenido"><section class="section"><div class="container content-narrow"><p class="eyebrow">Uso interno</p><h1>Publicar un recetario</h1><p>La clave se utiliza solo para esta publicación y no se guarda en el navegador.</p><form id="recipe-admin" class="form-shell"><label>Clave de publicación<input required type="password" name="token" autocomplete="current-password"></label><label>Título<input required name="title" maxlength="160"></label><label>Resumen<textarea required name="summary" maxlength="500" rows="3"></textarea></label><label>Ingredientes — uno por línea<textarea required name="ingredients" rows="8"></textarea></label><label>Preparación — un paso por línea<textarea required name="steps" rows="8"></textarea></label><label>Etiquetas separadas por coma<input name="tags" placeholder="rápida, desayuno, vegetariana"></label><label>Ruta de imagen local (opcional)<input name="imageUrl" placeholder="/hero-collage.avif"></label><button class="button dark" type="submit">Publicar receta</button><p class="form-status" role="status" aria-live="polite"></p></form><div id="recipe-admin-success" class="analytics-note" hidden></div><p><a href="/recetas.html">Ver recetarios</a> · <a href="/">Volver al sitio</a></p></div></section></main><script src="/panel-contenido.js" defer></script></body></html>
