name: Aplicar actualización completa

on:
  push:
    branches:
      - mejoras-integrales-v5
    paths:
      - makanuy-complete-update-2.zip

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mejoras-integrales-v5
          fetch-depth: 0
      - name: Aplicar archivos validados
        run: |
          unzip -o makanuy-complete-update-2.zip
          rm -f makanuy-complete-update-2.zip .github/workflows/apply-update.yml .github/workflows/site-health.yml
          git config user.name "Makanuy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publicar mejoras de rendimiento, agenda y contenido"
          git push origin HEAD:mejoras-integrales-v5
